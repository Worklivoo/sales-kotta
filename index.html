    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['"DM Sans"', 'system-ui', '-apple-system', '"Segoe UI"', 'sans-serif'],
            },
            colors: {
              primary: '#EBF57D',
              background: '#F6F6F6',
              surface: '#FFFFFF',
              ink: 'var(--ink)',
              'ink-soft': 'var(--ink-soft)',
              paper: 'var(--paper)',
              stone: 'var(--stone)',
              'stone-deep': 'var(--stone-deep)',
              card: 'var(--white)',
              muted: 'var(--muted)',
              'muted-soft': 'var(--muted-soft)',
              lime: 'var(--lime)',
              'lime-deep': 'var(--lime-deep)',
              line: 'var(--line)',
              'line-soft': 'var(--line-soft)',
            },
             borderRadius: {
              lg: '0.5rem',
              md: 'calc(0.5rem - 2px)',
              sm: 'calc(0.5rem - 4px)',
              pill: '999px',
              card: 'var(--radius-card)',
              section: '32px',
              panel: '22px',
              tile: '14px',
            },
            keyframes: {
              "accordion-down": {
                from: { height: "0" },
                to: { height: "var(--radix-accordion-content-height)" },
              },
              "accordion-up": {
                from: { height: "var(--radix-accordion-content-height)" },
                to: { height: "0" },
              },
              "slide-in-from-left": {
                 "0%": { transform: "translateX(-100%)", opacity: 0 },
                 "100%": { transform: "translateX(0)", opacity: 1 }
              }
            },
            animation: {
              "accordion-down": "accordion-down 0.2s ease-out",
              "accordion-up": "accordion-up 0.2s ease-out",
              "slide-in-from-left-10": "slide-in-from-left 0.3s ease-out forwards"
            },
          }
        }
      }
    </script>
    <style>
      :root {
        --mobile-header-h: calc(56px + env(safe-area-inset-top));
        --mobile-bottom-nav-h: calc(64px + env(safe-area-inset-bottom));
      }

      /* Custom scrollbar for better aesthetics */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #D1D5DB;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #9CA3AF;
      }
      
      @keyframes slideInLeft {
        from {
          opacity: 0;
          transform: translateX(-20px);
        }
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }
      
      .animate-in.slide-in-from-left-10 {
        animation: slideInLeft 0.3s ease-out forwards;
      }
    </style>
</head>
